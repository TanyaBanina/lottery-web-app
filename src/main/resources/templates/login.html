<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <title></title>
</head>
<body>
<div th:replace="~{layout :: topbar}"></div>

<div class="login-page">
<div class="login-container">
    <h2 class="login-header">Login</h2>
    <form class="login-form" role="form" th:action="@{/login}" method="post">
        <div class="field">
            <label th:text="#{login.username}" for="username">Username</label>
            <input type="text" id="username" name="username" autofocus="autofocus"/> <br/>
        </div>

        <div class="field">
            <label th:text="#{login.password}" for="password">Password</label>
            <input type="password" id="password" name="password"/> <br/>
        </div>

        <button class="login-button" type="submit" th:text="#{login.login}">Log in</button>
    </form>
</div>
</div>
</body>
</html>
