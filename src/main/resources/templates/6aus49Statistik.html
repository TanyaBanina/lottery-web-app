<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/css/6aus49Statistik.css}">
    <title>6 aus 49</title>
</head>
<body>
    <div th:replace="~{layout :: topbar}"></div>

    <div class = "draw_and_stats">
        <div class = "perform_draw">
            <h1>6 aus 49 Lottery Statistik</h1>
            <div class="draw_button">
                <form th:action="@{/performDraw}" method="post">
                    <button type="submit" class="btn">Jetzt Ziehung durchführen</button>
                </form>
            </div>
            <div th:if="${drawMessage}" class="popup-message" th:classappend=" ' success'">
                <p th:text="${drawMessage}"></p>
            </div>
        </div>

        <div class = "table">
            <table>
                <thead>
                <tr>
                    <th>Ziehungsdatum</th>
                    <th>Gesamtwettzahl</th>
                    <th>Gesamtumsatz (€)</th>
                    <th>Gesamtzahlung (€)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${statisticsByDate}">

                    <td th:text="${entry.key}"></td>

                    <td th:text="${entry.value['slipCount']}"></td>

                    <td th:text="${entry.value['revenue']}"></td>

                    <td th:text="${entry.value['payout']}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
