<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/css/totoForm.css}">
    <title>Bestätigung</title>
</head>
<body>
    <div th:replace="~{layout :: topbar}"></div>
    <h1>Bestätigung</h1>
    <p>Ihre Tipps:</p>
    <table>
        <thead>
            <tr>
                <th>Spiel</th>
                <th>Tipp</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${predictions}">
                <td th:text="${match.teamA} + ' - ' {match.teamB}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
        </tbody>
    </table>
    <button type="button" class="Button--primary">
        <span>Abschließen</span>
    </button>
    <a href="/bundesliga1">
        <button class="Button--primary" th:text="#{login.login}">Neues Spiel</button>
    </a>
</body>
</html>
