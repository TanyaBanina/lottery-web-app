<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <title>Gutschein kaufen</title>
</head>
<body>
<div th:replace="~{layout :: topbar}"></div>
<div class="voucher-container">
    <div class="voucher-box">
<h1>Gutschein kaufen</h1>

<form th:action="@{/voucher/buy}" method="post">
    <label for="amount">Betrag:</label>
    <input type="number" step="0.01" min="0.01" id="amount" name="amount" placeholder="Betrag in €" required>
    <button type="submit">Kaufen</button>
</form>
</div>
    </div>
</body>
</html>
