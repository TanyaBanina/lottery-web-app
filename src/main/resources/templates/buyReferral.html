<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <title>Gutschein kaufen</title>
</head>
<body>
<div th:replace="~{layout :: topbar}"></div>

<div class="voucher-container">
    <div class="voucher-box">
        <h1>Ihr Referral-Code</h1>
        <p>Ihr persönlicher Weiterempfehlungs-Code lautet:</p>
        <div>
            <strong th:text="${referralCode}"></strong> <!-- Zeigt den Referral-Code -->
        </div>
        <p>Wenn sich ein neuer Nutzer mit Ihrem Code registriert, erhalten Sie 10€ als Dankeschön!</p>
        <p>und der neue Nutzende 10€ als Willkommensbonus</p>
        <br>
        <a href="/konto">Zurück zur Konto-Seite</a>
    </div>
</div>
</body>
</html>
